services:
  engine:
    build: .
    container_name: cold-fold-engine
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
    volumes:
      - ./:/engine
    develop:
      watch:
        - path: ./
          action: rebuild
          ignore:
            - __pycache__
            - "*.pyc"
            - .venv

  redis:
    image: redis:7-alpine
    container_name: cold-fold-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
